allowBuilds:
  esbuild: true
# Keep host-native binaries for builds and Linux ARM64 binaries for Lambda.
permissions:
  payload:
    skills: true
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc

packages:
  - "."

skills:
  dirs:
    - .claude/skills